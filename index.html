போட்டிககளில் முதலிடம் பெற்று மாநில அளவிலான போட்டிக்குத் தேர்வாகினர். ததவில் தவில் இசையில் தனது தனித்திறமையை வெளிப்படுத்திய மாணவர் மா.நாகப்பாண் டி மாவடட அளவில் முதலிடம் பெற்று மாநில அளவிலான போட்டியில் பங்கேற்றார். மேலும், மாநில அளவில் மூன்றா ம் இடம் பெற்று பள்ளிக்குப் பெருமை சேர்த்தார். நாட்டுப்புற நடனம் (ததனி) நாட்டுப்புற நடனம் (தனி) பிரிவில் பத்தாம் வகுப்பு மாணவி அ.யாசிகா மாவடட அளவில் முதலிடம் பெற்று மாநில அளவிலான கல ைத்திருவிழா போட்டியில் பங்கேற்றார். தளிர் நவம்பர் 2026 4 | |"}, {"page": 5, "pdf_page": 5, "text": "உருமி பரததநாட்டியம் – குழுப்பிரிவு மாணவர்கள் மு.பபழனிவேல், மு.ஹரித்ரா, வி.விஜயஹர்ஷினி மற்றும் பபா.பபவித்ரா ஆகிய�ோர் இணைந்து குழு நடனத்தில் சிறப்பாக ச் செயல்பட்டு மாவட்ட அளவில் முதலிடம் பெற்றற்றனர். உருமி இசைப் போட்டியில் மாணவர் அ.அழகுப்பெருமாள் மாவடட அளவில் முதலிடம் பெற்று மாநில அளவிலான போட்டியில் பங்கேற்றுச் சிறப்பித்தார். பபரதநாட்டியத் தனிப்பிரிவில் மாணவர் மு.பபழனிவேல் (ஒன்பதாம் வகுப்பு) தனது நடனத் திறமையை வெளிப்படுத்தி மாவட்ட அளவில் முதலிடம் பெற்றாற்றார். தளிர் நவம்பர் 2026 5 | |"}, {"page": 6, "pdf_page": 6, "text": "உ லகிலேயே மகிழ்ச்சியான சிறுவன் என்ற இச்சிறுகதை நூல் பல நாட்டிலிருந்து எடுதத சிறுகதைககளின் த�ொகுப்பாகும். இப்புத்தகத்தில் ஏழு சிறுகதைககள் உள்ளன . ஒவ்வொன்றும் வேறு வேறு நாட்டுச் சிறுகதைககள். இதை த�ொகுத்து எழுதியவர் ஆயிஷா இரா. நடராஜன் அவர்கள். இவர் பல சிறு நாவல்களை சிறுவர்க ள் எளிமையாகக புரிந்துக�ொள்ளும் வகையில் எழுதியுள்ளா ர். இப்புத்தகத்தில் உள்ள கதைகள் 1) யூனியும் காளையும்(க�ொரியா)- ஓ யாங்-சு 2) படைவீரர் மககன் (இந்தி)-ஷோபா க�ோஸ். 3) நரி பையன் (ஜப்பான்)- நான் கிச்சி நீமி 4) டென்னிஸ் ஆடடம் (வங்காள ம்) தீவாலி டெப்ராய் 5) உலகிலேயே மகிழ்ச்சியான சிறுவன் (பிலிப் பைன்ஸ்) என். வி. எம் கான்ஸ ெலஸ். 6) வித்தியாசமான தீபாவளி (ஆங்கிலம்). தீத்தி தவ�ோரா இந்தியா 7) வானில் ஒரு படடம் (பாகிஸ்தான்) சையது பதேர் அலி அன்வாரி. இந்த ஏழு கதைககளில் எனக்கு பிடிதத ஒரு கதையை பகிர்ந்து க�ொள்ள விரும்புகிறேன். இதில் எனக்கு பிடிதத கதை \"படை வீரர் மககன்\". இந்தியாவை சேர்ந்தர்ந்த ேஷாபா க�ோஸ் எழுதிய கதை. விமானம் கீழே விழுந்து விபத்துக்குள்ளா கிறது அதிலிருந்து பாராசூட் மூலம் ஒரு மனிதன் தரையில் இறங்குகிறான் அப்போது அப்பகுதியில் இருந்த சிறுவன் அவனைப் பார்க்கிறான். அந்த மனிதன் யார் என்று விசாரிக்கிறான் அவன் ஒரு படை வீரன் என்பதை அறிகிறான் சிறுவனிடம் அந்த மனிதன் பல கேள்விகளை கேட் கிறான். ஆனால் சிறுவன் தைரியமாகக பதில் அளிக்கிறான். சிறுவனின் பெயர் மக்பூல் அவருடைய தந்தை இஸ்மா யில் பாஷா. அவர் நாட்டிற் காகக உயர் தியாககம் செய்த ஒரு வீரர். அவருக்கு வீரத்திற்கான தேசிய விருதும் கிடைத்துள்ள து. தன்னுடைய தந்தையைப் போலவே மக்பூவும் நாட்டுப்பற்றுடன் இருக்கிறான். எதிரிகளை க் கக ண்டு பயப்ப டாமல் தன்னுடைய நாட்டின் பாதுகாப் பை பற்றி சிந்திக்கிறான். இறுதியில் ராணுவ வீரர்களும் அங்கு வந்து சேர்கிறார்கள். ம க் பூ லி ன் தைரியத் தையும் நாட்டுப் பற்ற ை ையும் அறிந்து பாராட்டுகிறார்கள். பல நாட்டு சிறுவர்க ளின் வாழ்க்கை முறை மற்றும் அவர்களிடம் இருக்கும் சிறந்த ந்த பண்புகக ள் ஆகியவற்றை ைக் ககற்றுத் தரும் வகையில் இந்நாவலின் மையக் ககருத்து இருக்கிறது. முக்கியமாகக இந்த கதையின் சிறப்பு நாட்டுப்பற்று அதுவும் ஒரு சிறுவனின் நாட்டுப்பற்றை ை மையமாகக வைத்து எழுதியது தேசப்பற்று என்பது ஒரு உயர்ந்த பண்பு அதுவும் சிறுவனின் நாட்டுப் பற்று. இந்த கதை மட்டும் அல்லாம ல் ஒவ்வொரு கதையும் என்னோ டு உரையாடி இருக்கிறது எனவே இந்தக் கதைககள் பற்றி உங்கள�ோடு உரையாடிக் க�ொண்டிருக்கிறேன். வாய்ப்பு இருந்தால் நீங்களும் இந்த சிறிய புத்தககத் தை வாங்கிப் படித்து பாருங்கள். உங்களுக்கும் பிடிக்கும் என்று நம்புகிறேன். நன்றி. நூலாய்வு... – ம. சாம் ந�ோவா, 9 - A நூலின் பெயர் : உலகிலேயே மகிழ்ச்சியான சிறுவன் ஆசிரியர் : ஆயிஷா இரா. நடராஜன் வகை : நாட�ோடிக் கதைகள் உலகிலேயே மகிழ்ச்சியான சிறுவன் தளிர் நவம்பர் 2026 6 | |"}, {"page": 7, "pdf_page": 7, "text": "நூலாய்வு... – பூரணா ஸ்ரீ, 9-A தங்க தேவதை என் தங்கை `தங்க தேவதை என் தங் கை', இது ஜென்னி ஃபீப்ள ஸ் பீட் டர்சன் எழுதிய நூலின் தமிழாக்கம் ஆகும். இந்த புத் தககத் தை க�ொ.மா.க�ோ. இளங்கோ அவர்கள் இந்த புத்தககத் தை தமிழ் ம�ொழியில் ம�ொழிபெயர்ப்பு செய்துள்ளா ர். தமிழ்நாடு அறிவியல் இயக்கம் (TNSF) இந்த விழிப்புணர்வு கதையை வெளியிட்டுள்ளது. புத்தக த்தின் மையக்க ருத்து: செவித்திறன் குறைபாடு உள்ள ஒரு குட்டிச் சிறுமியைப் பற்றியும், அவளது உலககம் எப்படியிருக்கிறது என்பதைப் பற்றி ்தியுள்ளன ர். பழந்த ந்தமிழர் எழுத்து முறைகளை அறிந்துக�ொள்வத�ோ டு, நம் பண்பாட்டுப் பாரம்ப ரியத் தை அடுதத தலைமுறைக்குக் க�ொண்டு செல்லும் சிறந்தந்த முயற்சியாகக இது அமைகிறது. தEொன் மையை நFோக்கி ஒரு புதிய முயற்சி – பிராமி எழுத்துப் பயிற்சி – பா.பவித்ரா 9 - A. நான் படிதத புத்தககங்களில் எனக்கு மிககவும் பிடிதத புத்தககம் \"ஓர் உல்லாசப் பயணம்\" ஆகும். இந்நூலை எழுதியவர் வண்ணதாசன். இவருடைய இயற்பெயர் எஸ். கல்ய ாணசுந்தரம். இவர் தமிழ் இலக்கிய உலகில் சிறந்து விளங்கும் எழுத்தாளர் ஆவார். இக்கதையில் எட்டாம் வகுப்பு படிக்கும் ஒரு சிறுவன் குற்றாலத்திற்கு உல்லாசப் பயணம் செல்ல ஆசைப்படுகிறான். ஆககஸ்ட் 15ஆம் தேதி சுற்றுலா செல்ல வேண்டும் என்ற அவனுடைய ஆசை கதையின் த�ொடக்கமாகக அமைகிறது. அவனுடைய ஆசை, குடும்பச் சூழ்நிலை, தந்தை யின் அன்பு ஆகியவற்றை ை ஆசிரியர் அழகாகக எடுத்துரைத்துள்ளா ர். ஒரு சிறுவனின் சிறிய ஆசையைக் க�ொண்டு குடும்பத் தில் உள்ள அன்பு, பாசம் மற்றும் புரிதலை ஆசிரியர் நமக்கு உணர்த்துகிறார். தந்தை க்கும் மககனுக்கும் இடையே இருக்கும் அன்பும், அவர்க ளுடைய மன உணர்வுககளும் கதையில் அழகாகக வெளிப்படுகின்றன . ஆசிரியர் எளிய ச�ொற்களையும் இயல்பான உரையாடல்களையும் பயன்படுத்தியிருப்பது கதையைப் படிப்பதற்கு ஆர்வ மாகக உள்ள து. இந்தக் கதையைப் படிதததன் மூலம் பெற்றோரின் அன்பை யும் அவர்களின் சூழ்நிலையையும் புரிந்துக�ொள்ள வேண்டும் என்பதை அறிந்து க�ொண்டே ன். நம்மிடம் இருப்பதைக் க�ொண்டு மகிழ்ச்சியாகக வாழ வேண்டும். என்பதை யும் தெரிந்துக�ொண்டே ன். எனக்கு இந்தப் புத் தககம் மிககவும் பிடித்திருந்தது. குறிப் பாகக, ஒரு சிறுவனின் ஆசையை மையமாகக வைத்து குடும்ப உறவுககளின் முக்கியத்துவத் தை எடுத்துக் கூறிய விதம் என் னைக் ககவர்ந்தது. இந்தப் புத்தககம் எனக்கு ஒரு நல்ல வாசிப்பு அனுபவத் தைத் தந்தது. இதுபோன்ற நல்ல புத்தககங்களை அனை னைவரும் படிக்க வேண்டும் என்று விரும்புகிறேன். ஓர் உலலாசப் பயணம் தளிர் நவம்பர் 2026 9 | | நூலாய்வு..."}, {"page": 10, "pdf_page": 10, "text": "ஒளியின் திருநாளான தீபாவளிப் பண்டிகையை முன்னிட்டு, நமது பள்ளியில் மாணவர்க ளுடன் இணைந்து தீபாவளி விழா சிறப்பாககக் க�ொண்டாடப்படடது. விழாவின் த�ொடக்கமாகக, மாணவர்களுக்கு தீபாவளியைப் பாதுகாப்பாககக் க�ொண்டாடுவது குறிதத விழிப்புணர்வு வழங்கப்படடது. பட் டாசுகளை வெடிக்கும் ட வேண்டும், பாட வேண்டும் என்று வலியுறுத்தினார். 1. குழந் தைகள் தினத்தின் த�ொடக்கம் உலகக அளவில் குழந்தைககளின் உரிமைககள், ககல்வி, பாதுகாப்பு மற்றும் நலன் ஆகியவற்றை ை வலியுறுத்துவதற் காகக ஐக்கிய நாடுககள் சபை (UNO) 1954ஆம் ஆண்டு உலககக் குழந்தைககள் தினத் தைக் க�ொண்டாடும் எண்ணத் தை அறிமுககப்படுத்தியது. பின்னர் நவம்பர் 20ஆம் தேதி உலககக் குழந்தைககள் தினம ாககக் கடைப்பிடிக்கப்படடது. 2. இந்தியாவில் நவம்பர் 20 ஏன் நவம்பர் 14 ஆனது? இந்தியாவில் த�ொடக்க த்தில் நவம்ப ர் 20ஆம் தேதிதான் குழந்தைககள் தினம ாககக் க�ொண்டாடப்படடது. இந்தியாவின் முதல் பிரதமரான பண்டித ஜவஹர்லா ல் நேரு அவர்கள் 1889ஆம் ஆண்டு நவம்பர் 14ஆம் தேதி பிறந்தார். குழந்தைககள் மீது அவர் க�ொண்டிருந்த அளவற்ற அன்பினால் குழந்தைககள் அவரை 'சாச்சா நேரு' (Chacha Nehru) என்று அன்புடன் அழைத்தனர். 1964ஆம் ஆண்டு மே 27ஆம் தேதி அவர் மறைந்தார். அதன்பிறகு, அவரது பிறந்தந்த நாளான நவம்பர் 14ஆம் தேதியை இந்தியாவில் குழந்தைககள் தினம ாககக் க�ொண்டாட முடிவு செய்யப்படடது. அதன்ப டி 1964ஆம் ஆண்டு முதல் இந்தியாவில் நவம்பர் 14 குழந்தைககள் தினம ாககக் க�ொண்டாடப்படுகிறது 3. நேரு குழந் தைகள் மீது ஏன் அதிக அன்பு க�ொண்டிருநதார்? நேரு அவர்கள் குழந்தைகளை நாட்டின் எதிர்கால மாககக் ககருதினார். அவர் நம்பிய சில முக்கியமான ககருத்துககள்: குழந்தைககளுக்குத் தரமான ககல்வி கிடைக்க வேண்டும். குழந்தைககள் சுதந்திரமாககச் சிந்திக்க வேண்டும். அறிவியல் மனப்பான்மைன்மை வளர வேண்டும். விளையாட்டு, கல ை, இலக்கியம் என அனைத்துத் துறைககளிலும் குழந்தைககள் வளர வேண்டும். குழந்தைககளின் மகிழ்ச்சியும் நலனும் பாதுகாக்க ப்பட வேண்டும். தளிர் நவம்பர் 2026 26| |"}, {"page": 27, "pdf_page": 27, "text": "கு ழந்தைககளின் மகிழ்ச்சி, உரிமைககள், கன வுகக ள் மற்றும் எதிர்கால த் தைப் போற்றும் இனிய நாளே குழந்தைககள் தினம்! ஒவ்வோர் ஆண்டும் நம் பள்ளியில் குழந்தைககள் தினம் சிறப்பாககக் க�ொண்டாடப்பட்டு வருகிறது. அந்த வகையில், 2026ஆம் ஆண்டின் குழந்தைககள் தினக் க�ொண்டாடடங்களும் பல்வேறு சிறப்பு நிககழ்ச்சிககளுடன் நடைபெற உள்ளன . இந்த ஆண்டின் விழாக் க�ொண்டாடடங்கள், மாணவர்களின் மகிழ்ச்சியான தருணங்கள் மற்றும் சிறப்பு நிககழ்வுககள் அனைத்தும் நமது அடுதத தளிர் இதழில் வண்ணம யமான பதிவுகளாகக இடம்பெறும். குழந் தைகள் தினம் க�ொண்டாட்டஙகளும் மகிழ்ச்சியும்! க�ொண்டாட்டட்டஙகள் த�ொடரும்... நினைவுகள் அடுதத தளிரில் மலரும்! - கு.மீனா பட்டததாரி ஆசிரியர் இநத வரலாற்றிலிருந்து நாம் புரிந்துக�ொள்ள வேண்டியது... குழந்தைககள் தினம் என்பது வெறுமனே இனிப்புககள் வழங்கி, கல ை நிககழ்ச்சிககள் நடத்தி மகிழும் ஒரு நாள் மட்டுமல்ல. ஒவ்வொரு குழந்தைக்கும் ககல்வி, அன்பு, பாதுகாப்பு, சமத்துவம், சுதந்திரம் மற்றும் தங்க ளுடைய திறமைகளை வெளிப்படுத்துவதற்கான வாய்ப்புககள் கிடைக்க வேண்டும் என்பதை நினை னைவூட்டும் நாள். \"இன்றை ைய குழந்தைகள்தான் நாளைய இந்தியாவை உருவாக்கும் சிற்பிககள்!\" ஒரு முக்கியமான சுவாரஸயமான வரலாற்றுத் தகவல்! 1 9 5 7 ஆம் ஆண்டு நவம்ப ர் 14 அன்று குழந்தைககள் தின விழாவில் பேசிய நேரு அவர்கள், தனது பிறந்தந்த நாளைக் க�ொண்டாடுவதைவிட அந்த நாளைக் குழந்தைககள் தினம ாககக் க�ொண்டாட வேண்டும் என்பதே தனது விருப்பம் என்பதை வெளிப்படுத்தியிருந்தார். உண்மையில், குழந்தைககள் தினம் தனது பிறந்தந்த நாளுடன் இணைத்துக் க�ொண்டாடப்படுவதை அவர் விரும்ப வில்லை ை என்பதற்கும் வரலாற்று ஆவணங்க ள் சான்றாகக உள்ளன . குழந்தைககள் தின நல்வாழ்த்துககள்! ஒவ்வொரு குழந்தையும் ஓர் அழகிய கன வு; ஒவ்வொரு புன்னகை யும் ஓர் புதிய நம்பிக்கை ! குழந்தைககளின் உள்ள ங்க ளில் அறிவு மலரட்டும்! சிந்த னைககளில் புதுமை பிறக்க ட்டும்! முயற்சிககளில் வெற்றி குவியட்டும்! கன வுககள் அனைத் தும் நனவாகட்டும்! அன்பு, மகிழ்ச்சி, தன்னம்பிக்கை , படைப் பாற்ற ல் நிறைந்த குழந்தைப் பருவத் தை ஒவ் வொரு குழந்தையும் க�ொண்டாடட்டும்! அனைத் துக் குழந்தைகக ளுக்கும் இனிய குழந்தைககள் தின நல்வாழ்த்துககள்! தளிர் நவம்பர் 2026 27 | |"}, {"page": 28, "pdf_page": 28, "text": "ஒ ரு பள்ளியின் வளர்ச்சி என்பது ககல்வி ககற்பித்தல�ோடு மட்டும் நின்றுவிடுவதில்லை ை. மாணவர்களின் வாசிப்புப் பழக்க ம், சமூகப் ப ொறுப்பு, சிந்திக்கும் திறன், நல்ல பண்புககள் எனப் பல்வேறு பரிமாணங்களிலும் அவர்களை வளர்த்தெடுப்பதில்தான் அதன் முழுமை அடங்கியுள்ளது. இத்தகைய ககல்விச் சூழலை உருவாக்குவதில் ஆசிரியர்களின் பங்களிப்பு முக்கியமானது. அந்த வகையில், வாசிப் பையும் சமூககச் சிந்தனையை யும் தனது ககல்விப் பணிய�ோடு இணைத்துச் செயல்பட்டு வருபவர் நமது பள்ளியின் மூதத ஆசிரியர் திரு. மு. பழனிகுமார் அவர்கள். 03.10.1996 அன்று ஆசிரியர் பணியில் இணை ந்த ந்த இவர், 12.06.2000 அன்று நமது பள்ளியில் பணியில் சேர்ந்தார். சுமார் 30 ஆண்டுகால ஆசிரியர் பணிப் பயணத்தில், ககற்பிததல் பணிய�ோடு மாணவர்களின் தனித்திறன் மற்றும் சமூகப் பொறுப்புணர்வை வளர்ப்பதிலும் த�ொடர்ந்து ககவனம் செலுத்தி வருகிறார். பல்வேறு நூல்களை வாசிப்பதில் ஆர்வம் க�ொண்ட இவர், வாசிப் பைத் தனிப்ப டட பழக்கமாகக மட்டும் வைத்துக்ககொள்ளாம ல், அதன் பயனை னை மாணவர்களிடமும் க�ொண்டு சேர்க்க வேண்டும் என்ற எண்ணத்துடன் செயல்படுபவர். தான் வாசிக்கும் நூல்களின் ககருத்துகளைப் பிறருடன் பகிர்ந்துக�ொள்வத�ோ டு, மாணவர்களிடமும் வாசிப்பின் மீதான ஆர்வத் தை ஏற்படுத்தி வருகிறார். நமது பள்ளியில் ஜூனியர் ரெட் கிராஸ் (JRC) மன்றத் தையும் நூலகக மன்றத் தையும் சிறப்பாகக வழிநடத்தி வருகிறார். JRC மன்றத்தின் வாயிலாகக மாணவர்களிடம் சேவை மனப்பான்மைன்மை, ஒழுக்கம், மனிதநேயம், சமூகப் பொறுப்பு போன்ற பண்புகளை வளர்க்கும் செயல்பா டுகளை முன்னெ டுத்து வருகிறார். இம்மன்றத் தின் செயல்பா டுககளில் இவரது பங்களிப்பிற்காகப் பல்வேறு பாராட்டுகளை யும் விருதுகளை யும் பெற்றுள்ளா ர். நூலகக மன்றத்தின் செயல்பா டுககளில் இவரது ஈடுபாடு குறிப்பிடத்தக்கது. வாசிப்பும் சமூகச் சிந்தனையும் இணைநத ஆசிரியர்! தளிர் நவம்பர் 2026 28| |"}, {"page": 29, "pdf_page": 29, "text": "மாணவர்கள் நூலககத் தைப் பயன்படுத்துவத�ோடு நின்றுவிடாமல், நூல்களைத் தேர்ந்தெடுத்துப் படிததல், அவற்றின் ககருத்துகளைப் புரிந்துக�ொள்ளுதல், தாங்கள் வாசிதத நூல்களைப் பற்றிய நூலாய்வு எழுதுதல் என அடுததடுதத நிலைககளுக்கு அவர்களை அழைத்துச் செல்கிறார். பல மாணவர்களுக்கு நூலாய்வு எழுதும் முறையைக் ககற்றுக்ககொடுதததன் விளைவாகக, மாணவர்களும் தற்போ து தாங்கள் வாசிக்கும் நூல்களைப் பற்றிய நூலாய்வுகளை மேற்க்க ொண்டு வருகின்றன ர். வாசிப்பு இயக்கம் சார்ந்தர்ந்த நிககழ்வுகளை யும் ஆர்வத்துடன் ஒருங்கிணைத்து, மாணவர்களிடம் வாசிப்புப் பழக்கத் தை வளர்ப்பதில் த�ொடர்ந்து முனைப்புடன் செயல்பட்டு வருகிறார். பள்ளியின் வளர்ச்சியில் பழைய மாணவர்களின் பங்க ளிப்பும் முக்கியமானது என்பதை உணர்ந்து, பழைய மாணவர்களை ஒன்றிணைக்கும் முயற்சிககளிலும் ஈடுபட்டு வருகிறார். பழைய மாணவர் சங்கத்தின் வாயிலாகக முன்னாள் மாணவர்களைத் த�ொடர்புக�ொண்டு, அவர்களின் ஒத்துழைப்புடன் பள்ளிக்குத் தேவையான பல்வேறு உதவிகளைப் பெற்றுத் தருவதிலும் ஆர்வம் காட்டுகிறார். பள்ளிக்கும் அதன் முன்னாள் மாணவர்களுக்கும் இடையிலான உறவை வலுப்படுத்தும் இத்தகைய முயற்சிககள் பாராடடத்தக்கவை. சமூகக நிககழ்வுககள் குறிதத புரிதலும், சமூகக அக்கறையும் க�ொண்ட இவர், ககல்வி என்பது பாடப்புத்தககங்களைக் தளிர் நவம்பர் 2026 29 | |"}, {"page": 30, "pdf_page": 30, "text": "ககடந்து மாணவர்க ளின் சிந்தனைப் பரப் பை விரிவுபடுதத வேண்டும் என்ற எண்ணத்துடன் செயல்படுகிறார். தான் வாசிக்கும் நூல்களில் இடம்பெறும் ககருத்துகளைப் பகிர்ந்துக�ொள்வதும், அவற்றின் வழியாகக மாணவர்களிடையே புதிய சிந்தனைகளைத் தூண்டுவதும் இவரது இயல்பான பண்புககளில் ஒன்றா கும். ஒரு பள்ளியில் ஒவ்வொரு ஆசிரியரும் தங்களுக்கான தனித்துவமான பங்களிப் பை வழங்குகின்றன ர். அந்த வகையில், வாசிப்பு, சமூகப் பொறுப்பு, மாணவர் நலன், பழைய மாணவர் ஒருங்கிணைப்பு எனப் பல்வேறு தளங்களில் தனது பங்களிப் பைத் த�ொடர்ந்து வழங்கி வரும் திரு. மு. பழனிகுமார் அவர்களின் பணிககள் நமது பள்ளியின் செயல்பா டுககளுக்கு மேலும் வலுசேர்க்கின்றன . பள்ளியின் வளர்ச்சியைப் பல்வேறு தளங்களில் முன்னெ டுத்துச் செல்வதிலும், பள்ளிக்குத் தேவையான உதவிகளைப் பெற்றுத் தருவதிலும் ஆர்வத்துடன் செயல்படுபவர். பள்ளியில் நடைபெறும் விழாக்கள் மற்றும் நிககழ்வுகளைத் திடடமிட்டு ஒருங்கிணைப்பதிலும், அவற்றை ைச் சிறப்பாககவும் வெற்றிககரமாககவும் நடத்தி முடிப்பதிலும் பொறுப்புணர்வுடன் செயல்படுகிறார். ஒப்படைக்கப்படும் பொறுப்புகளை முழுமையாகக உணர்ந்து, அவற்றை ைச் செவ்வனே நிறைவேற்றுவதில் இவரது ஈடுபாடு வெளிப்படுகிறது. பள்ளியின் ஒட்டும�ொதத முன்னேற்றத் தில் தன்னால் இயன்ற பங்களிப் பை வழங்க வேண்டும் என்ற எண்ணம் இவரது செயல்பா டுககளில் த�ொடர்ந்து காணப்படுகிறது. அனுபவமும் வாசிப்பும் சமூகக அக்கறையும் இணை ந்த ந்த இவரது ஆசிரியர் பயணம், மாணவர்களிடையே நல்ல சிந்தனைகளை யும் வாசிப்புப் பழக்கத் தையும் வளர்க்கும் ஒரு த�ொடர்ச்சியான முயற்சியாகக அமைந்துள்ள து. ககற்பித்தல�ோடு நின்றுவிடாமல், பள்ளியின் ஒட்டும�ொதத வளர்ச்சியிலும் அக்கறையுடன் பங்கெடுக்கும் இவரது பணி த�ொடர்ந்து சிறக்க வாழ்த்துவ�ோம். - க.சுநதர பிரதீபபா, தலைமை ஆசிரியர் தளிர் நவம்பர் 2026 30| |"}, {"page": 31, "pdf_page": 31, "text": "– அ. ஜெஸிமா பானு ஆயவக உததவியாளர் அது எவ்வாறு உணவு உட்க்க ொள்ளும் என்ற விபரம் எவருக்கும் தெரியாது. இந்த ஈக்களில்   updateTransform();
  center();
  autoFit=true;
}
function fitWidth(){
  currentZoom=Math.max(.4,Math.min(4,(viewport.clientWidth-80)/wrapper.offsetWidth));
  updateTransform();
  center();
  autoFit=false;
}

function initBook(){
  try{
    if(window.St && St.PageFlip){
      pageFlip=new St.PageFlip(document.getElementById('book'),{
        width:PW,height:PH,size:'stretch',
        minWidth:Math.round(PW*.9),maxWidth:Math.round(PW*1.1),
        minHeight:Math.round(PH*.9),maxHeight:Math.round(PH*1.1),
        showCover:true,usePortrait:true,drawShadow:false,maxShadowOpacity:0,
        mobileScrollSupport:false,flippingTime:600,autoSize:true
      });
      pageFlip.loadFromHTML(pages);
      pageFlip.on('flip',e=>{currentPage=e.data+1;document.getElementById('current-page').textContent=currentPage;playFlip();});
      pageFlip.on('changeState',e=>{if(e.data==='flipping')playFlip();});
    }else{renderFallbackPage();showStatus('அடிப்படை வாசிப்பு முறை')}
  }catch(e){console.error(e);renderFallbackPage();showStatus('அடிப்படை வாசிப்பு முறை')}
  buildThumbnails();buildTOC();loading.style.display='none';setTimeout(fitScreen,80);
}
function buildThumbnails(){const box=document.getElementById('thumb-grid');box.innerHTML='';pages.forEach((p,i)=>{const img=p.querySelector('img');const d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${img.src}"><span>${i+1}</span>`;d.onclick=()=>goToPage(i+1);box.appendChild(d)})}
function buildTOC(){const box=document.getElementById('toc-list');box.innerHTML='';if(!TOC.length){box.innerHTML='<div class="empty">PDF உள்ளடக்கப் பட்டியல் இல்லை.</div>';return}TOC.forEach(x=>{const d=document.createElement('div');d.className='toc-item level-'+Math.min(3,x.level);d.textContent=x.title;d.onclick=()=>goToPage(x.page);box.appendChild(d)})}
function doSearch(){const q=document.getElementById('search-input').value.trim().toLowerCase();const box=document.getElementById('search-results');box.innerHTML='';if(!q){return}let count=0;SEARCH_INDEX.forEach(item=>{const idx=item.text.toLowerCase().indexOf(q);if(idx>=0 && count<50){const d=document.createElement('div');d.className='result';const start=Math.max(0,idx-55),end=Math.min(item.text.length,idx+110);const snippet=document.createElement('small');snippet.textContent=item.text.slice(start,end)+(end<item.text.length?'…':'');const t=document.createElement('strong');t.textContent='Page '+item.page;d.appendChild(t);d.appendChild(snippet);d.onclick=()=>goToPage(item.page);box.appendChild(d);count++}});if(!count)box.innerHTML='<div class="empty">தேடல் முடிவு இல்லை.</div>'}
function setupTabs(){[['search','tab-search','panel-search'],['pages','tab-pages','panel-pages'],['toc','tab-toc','panel-toc']].forEach(x=>{document.getElementById(x[1]).onclick=()=>{document.querySelectorAll('.side-tabs button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(x[1]).classList.add('active');document.getElementById(x[2]).classList.add('active')}})}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}}

document.getElementById('first').onclick=()=>goToPage(1);
document.getElementById('prev').onclick=()=>goToPage(currentPage-1);
document.getElementById('next').onclick=()=>goToPage(currentPage+1);
document.getElementById('last').onclick=()=>goToPage(TOTAL);
document.getElementById('goto').onclick=()=>goToPage(document.getElementById('goto-input').value);
document.getElementById('goto-input').onkeydown=e=>{if(e.key==='Enter')goToPage(e.target.value)};
document.getElementById('zoom-in').onclick=()=>userZoom(currentZoom+.25);
document.getElementById('zoom-out').onclick=()=>userZoom(currentZoom-.25);
document.getElementById('fit').onclick=fitScreen;
document.getElementById('fit-width').onclick=fitWidth;
document.getElementById('actual').onclick=()=>{userZoom(1);center()};
document.getElementById('center').onclick=center;
document.getElementById('full-btn').onclick=toggleFullscreen;

document.getElementById('pan-left').onclick=()=>viewport.scrollLeft-=200;
document.getElementById('pan-right').onclick=()=>viewport.scrollLeft+=200;
document.getElementById('pan-up').onclick=()=>viewport.scrollTop-=200;
document.getElementById('pan-down').onclick=()=>viewport.scrollTop+=200;

document.getElementById('help-btn').onclick=()=>alert('விசைப்பலகை குறுக்குவழிகள்:\n\n← / →  முந்தைய / அடுத்த பக்கம்\nHome / End  முதல் / கடைசி பக்கம்\n+ / -  ஸூம்\n0  100%\nF  முழுத்திரை\nEnter  பக்கத்திற்குச் செல்ல\nCtrl+F  தேடல்\n\nபக்கத்தை நகர்த்த: டூல்பாரில் உள்ள திசை பட்டன்களை (⬅ ⬆ ⬇ ➡) பயன்படுத்தலாம் அல்லது மவுஸால் இழுக்கலாம்.');
document.getElementById('search-btn').onclick=doSearch;
document.getElementById('search-input').onkeydown=e=>{if(e.key==='Enter')doSearch()};

viewport.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  isDragging=true;
  dragStartX=e.clientX;
  dragStartY=e.clientY;
  startScrollLeft=viewport.scrollLeft;
  startScrollTop=viewport.scrollTop;
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  viewport.scrollLeft=startScrollLeft-(e.clientX-dragStartX);
  viewport.scrollTop=startScrollTop-(e.clientY-dragStartY);
});
window.addEventListener('mouseup',()=>isDragging=false);

viewport.addEventListener('wheel',e=>{
  if(e.ctrlKey){
    e.preventDefault();
    userZoom(currentZoom-(e.deltaY*.003));
  }
},{passive:false});
window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
viewport.addEventListener('dblclick',()=>{userZoom(currentZoom<=1?1.5:1);});

window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();document.getElementById('search-input').focus();return}
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')goToPage(currentPage+1);
  else if(e.key==='ArrowLeft')goToPage(currentPage-1);
  else if(e.key==='Home')goToPage(1);
  else if(e.key==='End')goToPage(TOTAL);
  else if(e.key==='+')userZoom(currentZoom+.25);
  else if(e.key==='-')userZoom(currentZoom-.25);
  else if(e.key==='0'){userZoom(1);center()}
  else if(e.key.toLowerCase()==='f')toggleFullscreen();
  else if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen();
});
window.addEventListener('resize',()=>{if(autoFit)fitScreen();});
setupTabs();
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checkPassword(){if(!PASSWORD_HASH)return true;const input=document.getElementById('book-pwd-input').value;if(await sha256(input)===PASSWORD_HASH){document.getElementById('password-overlay').style.display='none';return true}document.getElementById('pwd-error').style.display='block';return false}
if(PASSWORD_HASH){document.getElementById('submit-pwd-btn').onclick=checkPassword;document.getElementById('book-pwd-input').onkeydown=e=>{if(e.key==='Enter')checkPassword()};document.getElementById('toggle-pwd-btn').onclick=()=>{const x=document.getElementById('book-pwd-input');x.type=x.type==='password'?'text':'password'};}
window.addEventListener('load',()=>{initBook()});
</script>
</body></html>
